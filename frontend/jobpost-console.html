  *{box-sizing:border-box;}

  h1,h2{font-family:var(--font-serif);font-weight:600;margin:0;}

  .masthead small{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);letter-spacing:.02em;}
  button{font-family:var(--font-sans);cursor:pointer;border-radius:3px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;font-size:13px;}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  button.ghost{border-color:var(--line);color:var(--ink-soft);}
  button.link{border:none;padding:2px 4px;color:var(--ink-soft);text-decoration:underline;background:none;}
  button.link.danger{color:var(--danger);}
  button:disabled{opacity:.5;cursor:default;}
  input,textarea,select{font-family:var(--font-sans);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 10px;font-size:14px;width:100%;}

  label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:26px;max-width:380px;margin:60px auto;}
  .row-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .err{color:var(--danger);font-size:13px;margin-top:8px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px;}
  .toolbar .field{margin-bottom:0;flex:1;min-width:150px;}
  .toolbar .actions{display:flex;gap:8px;}
  .entry{border-bottom:1px solid var(--line);padding:20px 0;display:flex;gap:18px;}
  .entry .num{font-family:var(--font-mono);color:var(--ink-soft);font-size:13px;width:28px;flex-shrink:0;padding-top:4px;}
  .entry .body{flex:1;}
  .entry h2{font-size:20px;}
  .entry h2:hover{color:var(--accent);}
  .entry p{margin:6px 0 10px;color:var(--ink-soft);font-size:14px;line-height:1.5;max-width:60ch;}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tag{font-family:var(--font-mono);font-size:11px;background:var(--tag-bg);color:var(--ink);padding:3px 7px;border-radius:3px;}
  .exp{font-family:var(--font-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);padding:2px 7px;border-radius:3px;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:28px;max-width:480px;width:100%;}
  .topline{display:flex;justify-content:space-between;align-items:center;}
  .switch{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  .switch button{border:none;background:none;text-decoration:underline;padding:0;color:var(--accent);}

</head>
